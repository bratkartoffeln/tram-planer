<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><div><div class="brand-badges"><span class="badge">SWE</span><span class="badge teal">EVAG</span><span class="badge" style="background:var(--gold);color:#19252b">FIKTIV</span></div><h1>FAHRPLAN MANAGER</h1><p>© MeisterErwat · Tablet Edition</p></div></div>
    <nav class="nav" id="nav">
      <button data-view="home" onclick="showView('home')" class="active"><span class="nav-icon">⌂</span> Übersicht</button>
      <button data-view="new" onclick="showView('new')"><span class="nav-icon">＋</span> Neue Fahrt</button>
      <button data-view="network" onclick="showView('network')"><span class="nav-icon">⑂</span> Linien & Netz</button>
      <button data-view="plans" onclick="showView('plans')"><span class="nav-icon">▣</span> Fahrpläne</button>

      <button data-view="history" onclick="showView('history')"><span class="nav-icon">◷</span> Historie</button>
