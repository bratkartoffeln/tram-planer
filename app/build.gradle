plugins {
    id 'com.android.application'
}

android {
    namespace 'de.meistererwat.fahrplanmanager'
    compileSdk 35

    defaultConfig {
        applicationId 'de.meistererwat.fahrplanmanager'
        minSdk 26
        targetSdk 35
        versionCode 620
        versionName '6.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    androidResources {
        noCompress += ['wav', 'mp3', 'ogg']
    }
}
